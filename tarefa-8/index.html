<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Explore a variety of indoor plants for your home or office.">
    <title>Indoor Plants</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            color: #26352c;
            background-color: #f5f7f3;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        h1 {
            margin: 0 0 32px;
            color: #1f5c3a;
            text-align: center;
        }

        h2 {
            margin: 28px 0 8px;
            color: #34734d;
        }

        p {
            margin: 8px 0;
        }

        p:nth-of-type(even) {
            font-weight: bold;
            color: #1f5c3a;
        }

        img {
            display: block;
            width: 100%;
            max-width: 380px;
            height: 250px;
            margin: 16px 0 28px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Indoor Plants</h1>

    <h2>Peace Lily</h2>
    <p>O Lírio-da-paz, conhecido por suas elegantes flores brancas, é uma escolha popular para ambientes internos.</p>
    <p>Preço: $15</p>
    <img src="https://edube.org/uploads/media/default/0001/04/spathiphyllum-peace-lily.jpg" alt="Lírio-da-paz">

    <h2>Zanzibar Gem</h2>
    <p>A Zamioculca, com sua folhagem verde brilhante, é uma planta de interior de baixa manutenção, perfeita para iniciantes.</p>
    <p>Preço: $20</p>
    <img src="https://edube.org/uploads/media/default/0001/04/zamioculcas-zanzibar-gem.jpg" alt="Zamioculca">
</body>
</html>
